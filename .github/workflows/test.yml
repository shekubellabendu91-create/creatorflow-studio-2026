name: CreatorFlow tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check content.js
          node --check app.js
          node --check creator-desk/app.js
      - name: Run CreatorFlow behavior tests
        run: npm test